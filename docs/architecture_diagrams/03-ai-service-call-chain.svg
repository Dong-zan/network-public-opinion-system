<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#f1f4fa"/></linearGradient>
    <filter id="s3" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1c3349" flood-opacity=".13"/></filter>
    <marker id="a3" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#4a73a8"/></marker>
    <style>.t{font:700 44px 'Microsoft YaHei',sans-serif;fill:#16324f}.st{font:400 21px 'Microsoft YaHei',sans-serif;fill:#60758a}.box{filter:url(#s3);stroke-width:2}.h{font:700 29px 'Microsoft YaHei',sans-serif;fill:#183650;text-anchor:middle}.m{font:500 19px 'Microsoft YaHei',sans-serif;fill:#506b82;text-anchor:middle}.d{font:400 17px 'Microsoft YaHei',sans-serif;fill:#6b8194;text-anchor:middle}.edge{stroke:#4a73a8;stroke-width:5;fill:none;marker-end:url(#a3)}.endpoint{font:600 17px Consolas,'Microsoft YaHei',sans-serif;fill:#3f628d;text-anchor:middle}</style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg3)"/><text x="100" y="105" class="t">AI 服务调用链</text><text x="100" y="145" class="st">backend 将事件、文章、分析与热度历史组装为统一 EventContext，并分发到三类 AI 能力</text>

  <rect x="650" y="220" width="620" height="210" rx="30" fill="#eaf1ff" stroke="#7896d2" class="box"/>
  <text x="960" y="285" class="h">EventContext</text><text x="960" y="330" class="m">event + articles + sentiment + heat history</text><text x="960" y="370" class="d">由 backend 查询 MySQL 后组装；ai_service 本身不直接读取数据库</text>
  <path d="M960 430v100M960 530H370v85M960 530v85M960 530h590v85" class="edge"/>

  <rect x="180" y="615" width="380" height="275" rx="28" fill="#e8f3ff" stroke="#75a7d6" class="box"/>
  <text x="370" y="680" class="h">Ask</text><text x="370" y="718" class="endpoint">POST /ai/ask</text><text x="370" y="765" class="m">问题分类与相关上下文选择</text><text x="370" y="803" class="d">规则回答或 LLM Provider</text><text x="370" y="842" class="d">输出回答、证据引用与限制说明</text>

  <rect x="770" y="615" width="380" height="275" rx="28" fill="#f0ebff" stroke="#9b83d5" class="box"/>
  <text x="960" y="680" class="h">Report</text><text x="960" y="718" class="endpoint">POST /ai/report</text><text x="960" y="765" class="m">Top-K 文章选择与特征提取</text><text x="960" y="803" class="d">结构化生成 + Pydantic 校验</text><text x="960" y="842" class="d">输出概览、趋势、风险与建议</text>

  <rect x="1360" y="615" width="380" height="275" rx="28" fill="#e7f7ef" stroke="#64b58a" class="box"/>
  <text x="1550" y="680" class="h">Verify</text><text x="1550" y="718" class="endpoint">POST /ai/verify</text><text x="1550" y="765" class="m">原子主张提取与多来源证据匹配</text><text x="1550" y="803" class="d">确定性核验与可信度评分</text><text x="1550" y="842" class="d">可选语义增强 / AI 可读解释</text>

  <rect x="525" y="955" width="870" height="72" rx="18" fill="#fff" stroke="#ced9e3" stroke-width="2"/><text x="960" y="999" class="m">LLM Provider：Fake（离线）或 DeepSeek（OpenAI-compatible SDK）</text>
  <path d="M370 890v65h250M960 890v65M1550 890v65h-250" class="edge"/>
</svg>
