<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t1 d1">
  <title id="t1">数据服务与接口层</title><desc id="d1">Frontend 与 Crawler 请求进入 FastAPI Router，经 Service Layer 处理后读写 Database，响应沿反向路径返回。</desc>
  <defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0l11 5.5L0 11z" fill="#2d6f9f"/></marker><style>.title{font:700 38px 'Microsoft YaHei',sans-serif;fill:#20262b}.sub{font:400 18px 'Microsoft YaHei',sans-serif;fill:#687078}.layer{font:700 18px 'Microsoft YaHei',sans-serif;fill:#2d6f9f;letter-spacing:2px}.h{font:700 24px 'Microsoft YaHei',sans-serif;fill:#252b30;text-anchor:middle}.b{font:400 16px 'Microsoft YaHei',sans-serif;fill:#555d64;text-anchor:middle}.mono{font:600 15px Consolas,'Microsoft YaHei',sans-serif;fill:#30383e;text-anchor:middle}.box{fill:#fff;stroke:#58636b;stroke-width:2}.blue{fill:#eef5fa;stroke:#2d6f9f;stroke-width:2.5}.flow{fill:none;stroke:#2d6f9f;stroke-width:4;marker-end:url(#a)}.return{fill:none;stroke:#89939a;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#a)}.thin{stroke:#a8b0b6;stroke-width:1.5}.label{font:500 14px 'Microsoft YaHei',sans-serif;fill:#2d6f9f}</style></defs>
  <rect width="1600" height="900" fill="#fafbfc"/><text x="70" y="72" class="title">数据服务与接口层</text><text x="70" y="105" class="sub">Backend request–service–persistence data path</text><line x1="70" y1="132" x2="1530" y2="132" class="thin"/>
  <text x="76" y="205" class="layer">CLIENT</text><text x="76" y="365" class="layer">INTERFACE</text><text x="76" y="540" class="layer">DOMAIN SERVICE</text><text x="76" y="735" class="layer">PERSISTENCE</text>
  <line x1="210" y1="160" x2="210" y2="810" stroke="#d0d5d9" stroke-width="1"/>

  <g transform="translate(320 170)"><path d="M0 0h310v120H0z" class="box"/><path d="M25 24h260v58H25zM120 94h70" fill="none" stroke="#4e5961" stroke-width="3"/><text x="155" y="112" class="mono">Frontend</text></g>
  <g transform="translate(970 170)"><path d="M0 0h310v120H0z" class="box"/><path d="M54 32h202M54 60h150M54 88h180" stroke="#4e5961" stroke-width="4"/><text x="155" y="112" class="mono">Crawler</text></g>
  <path d="M475 290v58h325" class="flow"/><path d="M1125 290v58H800" class="flow"/><text x="545" y="332" class="label">REST / JSON</text><text x="1010" y="332" class="label">POST articles</text>

  <g transform="translate(360 370)"><path d="M0 0h880v105H0z" class="blue"/><text x="440" y="39" class="h">FastAPI Router</text><text x="440" y="71" class="b">请求校验 · 路由分发 · 响应封装</text><path d="M70 88h740" class="thin"/><text x="135" y="101" class="mono">/api/*</text><text x="440" y="101" class="mono">/internal/articles</text><text x="730" y="101" class="mono">/internal/analysis</text></g>
  <path d="M800 475v52" class="flow"/><text x="820" y="508" class="label">validated schema</text>

  <g transform="translate(280 545)"><path d="M0 0h1040v125H0z" class="box"/><text x="520" y="37" class="h">Service Layer</text><line x1="32" y1="52" x2="1008" y2="52" class="thin"/>
    <path d="M40 70h210v38H40zM290 70h210v38H290zM540 70h210v38H540zM790 70h210v38H790z" fill="#f1f3f4" stroke="#8c969d"/>
    <text x="145" y="95" class="mono">Article / NLP</text><text x="395" y="95" class="mono">Aggregation</text><text x="645" y="95" class="mono">Heat / Lifecycle</text><text x="895" y="95" class="mono">AI Orchestration</text>
  </g>
  <path d="M800 670v48" class="flow"/><text x="820" y="703" class="label">ORM transaction</text>

  <g transform="translate(390 735)"><path d="M0 0h820v100H0z" class="blue"/><text x="410" y="36" class="h">Database · MySQL</text><text x="410" y="68" class="b">articles　analysis　events　ai_results　event_heat_history</text></g>
  <path d="M1235 735h105V422h-95" class="return"/><text x="1352" y="585" class="sub" transform="rotate(-90 1352 585)">query result / API response</text>
  <text x="70" y="870" class="sub">数据流：Client → Router → Service → Database　　虚线：查询结果与响应返回</text>
</svg>
