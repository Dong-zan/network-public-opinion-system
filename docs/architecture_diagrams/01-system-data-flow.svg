<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f9fc"/><stop offset="1" stop-color="#eef3f9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17324d" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#3973a8"/></marker>
    <style>
      .title{font:700 44px 'Microsoft YaHei',sans-serif;fill:#16324f}.subtitle{font:400 21px 'Microsoft YaHei',sans-serif;fill:#60758a}
      .stage{filter:url(#shadow);stroke-width:2}.name{font:700 28px 'Microsoft YaHei',sans-serif;fill:#16324f;text-anchor:middle}.module{font:500 18px 'Microsoft YaHei',sans-serif;fill:#526b82;text-anchor:middle}.detail{font:400 16px 'Microsoft YaHei',sans-serif;fill:#6d8092;text-anchor:middle}
      .flow{stroke:#3973a8;stroke-width:5;fill:none;marker-end:url(#arrow)}.flow-label{font:500 17px 'Microsoft YaHei',sans-serif;fill:#3973a8;text-anchor:middle}
      .lane{font:600 17px 'Microsoft YaHei',sans-serif;fill:#73869a;letter-spacing:2px}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="100" y="105" class="title">系统整体数据流架构</text>
  <text x="100" y="145" class="subtitle">从新闻采集、NLP 分析与事件聚合，到 AI 能力和前端展示的完整闭环</text>
  <text x="100" y="235" class="lane">数据采集</text><text x="575" y="235" class="lane">语义分析</text><text x="1015" y="235" class="lane">事件智能</text><text x="1510" y="235" class="lane">应用呈现</text>

  <rect x="70" y="300" width="220" height="210" rx="24" fill="#e8f3ff" stroke="#75a7d6" class="stage"/>
  <circle cx="180" cy="350" r="27" fill="#3973a8"/><path d="M166 350h28M180 336v28" stroke="#fff" stroke-width="4"/>
  <text x="180" y="410" class="name">Crawler</text><text x="180" y="445" class="module">新闻与微博采集</text><text x="180" y="478" class="detail">清洗 · 去重 · 推送</text>

  <rect x="335" y="300" width="220" height="210" rx="24" fill="#ffffff" stroke="#9aabba" class="stage"/>
  <path d="M395 342h100v58H395z M407 354h76M407 369h58M407 384h68" fill="none" stroke="#536f89" stroke-width="4"/>
  <text x="445" y="430" class="name">Articles</text><text x="445" y="465" class="module">backend / articles</text><text x="445" y="495" class="detail">原始新闻持久化</text>

  <rect x="600" y="300" width="220" height="210" rx="24" fill="#f0ebff" stroke="#9b83d5" class="stage"/>
  <circle cx="710" cy="362" r="34" fill="none" stroke="#7655bc" stroke-width="4"/><circle cx="698" cy="354" r="5" fill="#7655bc"/><circle cx="722" cy="354" r="5" fill="#7655bc"/><path d="M693 376q17 12 34 0" fill="none" stroke="#7655bc" stroke-width="4"/>
  <text x="710" y="430" class="name">NLP Analysis</text><text x="710" y="465" class="module">analysis : 9000</text><text x="710" y="495" class="detail">关键词 · 情感 · embedding</text>

  <rect x="865" y="300" width="220" height="210" rx="24" fill="#fff4df" stroke="#e1ab52" class="stage"/>
  <circle cx="975" cy="360" r="34" fill="none" stroke="#bf7d18" stroke-width="4"/><path d="M975 326v68M941 360h68M951 336l48 48M999 336l-48 48" stroke="#bf7d18" stroke-width="3"/>
  <text x="975" y="430" class="name" style="font-size:22px">Event Aggregation</text><text x="975" y="465" class="module">backend 聚合服务</text><text x="975" y="495" class="detail">召回 · 指纹 · 综合评分</text>

  <rect x="1130" y="300" width="220" height="210" rx="24" fill="#e7f7ef" stroke="#64b58a" class="stage"/>
  <path d="M1182 350q58-42 116 0v52q-58 42-116 0z" fill="none" stroke="#35966a" stroke-width="4"/><circle cx="1240" cy="376" r="13" fill="#35966a"/>
  <text x="1240" y="430" class="name">Events</text><text x="1240" y="465" class="module">事件中心与热度历史</text><text x="1240" y="495" class="detail">event_id · 状态 · 聚合向量</text>

  <rect x="1395" y="300" width="220" height="210" rx="24" fill="#ffeceb" stroke="#dc817b" class="stage"/>
  <path d="M1450 345h110v65h-110z M1470 330v15M1540 330v15M1475 370h60M1475 388h42" fill="none" stroke="#ba514b" stroke-width="4"/>
  <text x="1505" y="430" class="name">AI Service</text><text x="1505" y="465" class="module">ai_service : 8005</text><text x="1505" y="495" class="detail">Ask · Report · Verify</text>

  <rect x="1660" y="300" width="190" height="210" rx="24" fill="#eaf1ff" stroke="#7896d2" class="stage"/>
  <rect x="1702" y="337" width="106" height="72" rx="6" fill="none" stroke="#5375b8" stroke-width="4"/><path d="M1732 425h46M1755 409v16" stroke="#5375b8" stroke-width="4"/>
  <text x="1755" y="455" class="name">Frontend</text><text x="1755" y="487" class="module">React + Vite : 5173</text>

  <path d="M290 405H335" class="flow"/><path d="M555 405H600" class="flow"/><path d="M820 405H865" class="flow"/><path d="M1085 405H1130" class="flow"/><path d="M1350 405H1395" class="flow"/><path d="M1615 405H1660" class="flow"/>
  <text x="312" y="380" class="flow-label">POST</text><text x="577" y="380" class="flow-label">新闻内容</text><text x="842" y="380" class="flow-label">分析结果</text><text x="1107" y="380" class="flow-label">归属事件</text><text x="1372" y="380" class="flow-label">EventContext</text><text x="1637" y="380" class="flow-label">API</text>

  <rect x="335" y="660" width="1280" height="230" rx="28" fill="#ffffff" stroke="#d7e0e8" stroke-width="2"/>
  <text x="385" y="715" class="lane">BACKEND 编排层</text>
  <text x="385" y="765" class="module" text-anchor="start">① 接收并保存文章</text><text x="720" y="765" class="module" text-anchor="start">② 调用 NLP 并保存 analysis</text><text x="1120" y="765" class="module" text-anchor="start">③ 聚合/更新 events</text>
  <text x="385" y="825" class="module" text-anchor="start">④ 记录 event_heat_history</text><text x="720" y="825" class="module" text-anchor="start">⑤ 组装 EventContext 调用 AI</text><text x="1120" y="825" class="module" text-anchor="start">⑥ 通过 REST API 向前端提供结果</text>
  <text x="960" y="990" class="subtitle" text-anchor="middle">MySQL 持久化：articles · analysis · events · ai_results · event_heat_history</text>
</svg>
