<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef4fa"/></linearGradient>
    <filter id="s2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#18324a" flood-opacity=".13"/></filter>
    <marker id="a2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#3d78aa"/></marker>
    <style>.t{font:700 44px 'Microsoft YaHei',sans-serif;fill:#16324f}.st{font:400 21px 'Microsoft YaHei',sans-serif;fill:#60758a}.box{fill:#fff;stroke:#8fa8bc;stroke-width:2;filter:url(#s2)}.n{font:700 25px 'Microsoft YaHei',sans-serif;fill:#183650;text-anchor:middle}.d{font:400 17px 'Microsoft YaHei',sans-serif;fill:#687f93;text-anchor:middle}.num{font:700 20px 'Microsoft YaHei',sans-serif;fill:#fff;text-anchor:middle}.edge{stroke:#3d78aa;stroke-width:5;fill:none;marker-end:url(#a2)}.label{font:600 17px 'Microsoft YaHei',sans-serif;fill:#3d78aa}.yes{fill:#e6f7ee;stroke:#4aa878}.no{fill:#fff0e2;stroke:#dc9442}</style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg2)"/>
  <text x="100" y="100" class="t">Event_id 生成与事件归属流程</text><text x="100" y="140" class="st">基于 embedding 候选召回、事件指纹与多维规则评分，决定复用已有 event_id 或创建新事件</text>

  <rect x="80" y="330" width="235" height="170" rx="22" class="box"/><circle cx="115" cy="365" r="23" fill="#3d78aa"/><text x="115" y="372" class="num">1</text><text x="198" y="405" class="n">新闻输入</text><text x="198" y="442" class="d">title · content · source</text><text x="198" y="470" class="d">news_id 已落库</text>
  <rect x="370" y="330" width="235" height="170" rx="22" class="box"/><circle cx="405" cy="365" r="23" fill="#7655bc"/><text x="405" y="372" class="num">2</text><text x="488" y="405" class="n">Embedding 生成</text><text x="488" y="442" class="d">text2vec-base-chinese</text><text x="488" y="470" class="d">768 维归一化向量</text>
  <rect x="660" y="330" width="235" height="170" rx="22" class="box"/><circle cx="695" cy="365" r="23" fill="#3d78aa"/><text x="695" y="372" class="num">3</text><text x="778" y="405" class="n">候选事件召回</text><text x="778" y="442" class="d">活跃事件 + 向量相似度</text><text x="778" y="470" class="d">代表文章与事件中心</text>
  <rect x="950" y="330" width="235" height="170" rx="22" class="box"/><circle cx="985" cy="365" r="23" fill="#bf7d18"/><text x="985" y="372" class="num">4</text><text x="1068" y="405" class="n">Fingerprint 匹配</text><text x="1068" y="442" class="d">核心实体 · 关键词 · 标题</text><text x="1068" y="470" class="d">时间/地点/人物事件对象</text>
  <rect x="1240" y="330" width="235" height="170" rx="22" class="box"/><circle cx="1275" cy="365" r="23" fill="#bf7d18"/><text x="1275" y="372" class="num">5</text><text x="1358" y="405" class="n">综合评分</text><text x="1358" y="442" class="d">相似度 + 指纹 + 标题</text><text x="1358" y="470" class="d">冲突检查 + 事件纯度</text>

  <path d="M315 415h55M605 415h55M895 415h55M1185 415h55" class="edge"/>
  <path d="M1475 415h65" class="edge"/>
  <polygon points="1660,315 1780,415 1660,515 1540,415" fill="#fff" stroke="#5c7890" stroke-width="3" filter="url(#s2)"/><text x="1660" y="405" class="n">达到匹配阈值</text><text x="1660" y="440" class="d">且无硬冲突？</text>

  <path d="M1660 515v135h-380" class="edge"/><text x="1680" y="585" class="label">否</text>
  <rect x="1030" y="650" width="250" height="170" rx="22" class="box no"/><text x="1155" y="710" class="n">创建新事件</text><text x="1155" y="750" class="d">写入 events</text><text x="1155" y="780" class="d">数据库生成新 event_id</text>

  <path d="M1780 415h60v405H1500" class="edge"/><text x="1800" y="390" class="label">是</text>
  <rect x="1500" y="650" width="250" height="170" rx="22" class="box yes"/><text x="1625" y="710" class="n">加入已有事件</text><text x="1625" y="750" class="d">复用候选 event_id</text><text x="1625" y="780" class="d">更新事件中心 embedding</text>

  <path d="M1280 735h220" class="edge" opacity="0"/>
  <rect x="585" y="890" width="750" height="90" rx="20" fill="#e9f1f8" stroke="#acc0d1" stroke-width="2"/><text x="960" y="928" class="n">结果回写</text><text x="960" y="960" class="d">articles.event_id 与 analysis.event_id 指向最终事件；随后刷新热度、阶段与 AI 报告</text>
  <path d="M1155 820v70H940" class="edge"/><path d="M1625 820v70h-585" class="edge"/>
</svg>
