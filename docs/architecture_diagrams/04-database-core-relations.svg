<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef3f8"/></linearGradient>
    <filter id="s4" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#18324a" flood-opacity=".12"/></filter>
    <style>.t{font:700 44px 'Microsoft YaHei',sans-serif;fill:#16324f}.st{font:400 21px 'Microsoft YaHei',sans-serif;fill:#60758a}.table{fill:#fff;stroke:#8ea6b9;stroke-width:2;filter:url(#s4)}.head{fill:#315f86}.head2{fill:#507da3}.hn{font:700 25px Consolas,'Microsoft YaHei',sans-serif;fill:#fff}.field{font:400 17px Consolas,'Microsoft YaHei',sans-serif;fill:#405b72}.key{font:700 17px Consolas,'Microsoft YaHei',sans-serif;fill:#1c4f79}.rel{stroke:#4e789d;stroke-width:4;stroke-dasharray:11 8;fill:none}.card{font:600 17px 'Microsoft YaHei',sans-serif;fill:#315f86}.legend{font:400 17px 'Microsoft YaHei',sans-serif;fill:#667d90}</style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg4)"/><text x="100" y="100" class="t">数据库核心关系图</text><text x="100" y="140" class="st">MySQL 核心业务表通过 news_id / event_id 形成逻辑关联；当前 SQLAlchemy 模型未声明 ForeignKey 约束</text>

  <g transform="translate(90 245)"><rect width="390" height="310" rx="18" class="table"/><path d="M0 18Q0 0 18 0h354q18 0 18 18v52H0z" class="head"/><text x="28" y="46" class="hn">articles</text><text x="28" y="110" class="key">PK  news_id : BIGINT</text><text x="28" y="147" class="key">REF event_id : BIGINT?</text><text x="28" y="184" class="field">title / content / source / url</text><text x="28" y="221" class="field">publish_time / platform / author</text><text x="28" y="258" class="field">repost / comment / like counts</text><text x="28" y="295" class="field">reference &amp; duplicate metadata</text></g>

  <g transform="translate(90 650)"><rect width="390" height="310" rx="18" class="table"/><path d="M0 18Q0 0 18 0h354q18 0 18 18v52H0z" class="head2"/><text x="28" y="46" class="hn">analysis</text><text x="28" y="110" class="key">PK  id : BIGINT</text><text x="28" y="147" class="key">REF news_id / event_id</text><text x="28" y="184" class="field">summary / keywords / sentiment</text><text x="28" y="221" class="field">heat_score / stage / risk_level</text><text x="28" y="258" class="field">similar_news</text><text x="28" y="295" class="field">embedding : JSON (768维)</text></g>

  <g transform="translate(765 365)"><rect width="390" height="350" rx="18" class="table"/><path d="M0 18Q0 0 18 0h354q18 0 18 18v52H0z" class="head"/><text x="28" y="46" class="hn">events</text><text x="28" y="110" class="key">PK  event_id : BIGINT</text><text x="28" y="147" class="field">title / summary</text><text x="28" y="184" class="field">heat / risk_level / stage</text><text x="28" y="221" class="field">create_time / update_time / status</text><text x="28" y="258" class="field">extra : JSON</text><text x="28" y="295" class="field">embedding : JSON</text><text x="28" y="332" class="field">embedding_count</text></g>

  <g transform="translate(1440 245)"><rect width="390" height="310" rx="18" class="table"/><path d="M0 18Q0 0 18 0h354q18 0 18 18v52H0z" class="head2"/><text x="28" y="46" class="hn">ai_results</text><text x="28" y="110" class="key">PK  id : BIGINT</text><text x="28" y="147" class="key">REF event_id : BIGINT</text><text x="28" y="184" class="field">overview / ai_report / authenticity</text><text x="28" y="221" class="field">propagation_analysis / path</text><text x="28" y="258" class="field">provider / status / error_message</text><text x="28" y="295" class="field">generated_at</text></g>

  <g transform="translate(1440 650)"><rect width="390" height="310" rx="18" class="table"/><path d="M0 18Q0 0 18 0h354q18 0 18 18v52H0z" class="head2"/><text x="28" y="46" class="hn">event_heat_history</text><text x="28" y="110" class="key">PK  id : BIGINT</text><text x="28" y="147" class="key">REF event_id : BIGINT</text><text x="28" y="184" class="field">heat : FLOAT</text><text x="28" y="221" class="field">created_at : DATETIME</text><text x="28" y="258" class="field">stage_snapshot : VARCHAR</text></g>

  <path d="M480 400h185q100 0 100 75" class="rel"/><text x="560" y="382" class="card">event_id → events</text>
  <path d="M480 770h185q100 0 100-115" class="rel"/><text x="555" y="802" class="card">event_id → events</text>
  <path d="M285 555v95" class="rel"/><text x="305" y="610" class="card">news_id</text>
  <path d="M1155 475q100-75 285-75" class="rel"/><text x="1230" y="380" class="card">events 1 ─ N ai_results</text>
  <path d="M1155 655q100 115 285 115" class="rel"/><text x="1210" y="815" class="card">events 1 ─ N heat history</text>

  <line x1="760" y1="985" x2="860" y2="985" class="rel"/><text x="885" y="991" class="legend">虚线表示应用层逻辑关联，并非数据库外键约束</text>
</svg>
