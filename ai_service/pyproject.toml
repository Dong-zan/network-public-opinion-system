[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-public-opinion-ai-service"
version = "0.1.0"
description = "Event-grounded question answering service for member 5"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1.0",
    "openai>=2.0,<3.0",
    "pydantic>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "uvicorn[standard]>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
